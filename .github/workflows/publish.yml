name: Publish Daf Yomi
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 0,3,6,9,12,15,18,21 * * *'
permissions:
  contents: read
concurrency:
  group: daf-yomi-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Moriahise/Daf-Yomi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pyluach==2.3.0
      - name: Verify reader isolation and current daily assignment
        run: python -m unittest discover -s reader -p 'test_*.py' -q
      - name: Build the daily reader
        run: python reader/build.py
      - name: Check Pages activation
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          request=urllib.request.Request('https://api.github.com/repos/Moriahise/Daf-Yomi/pages',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.load(response)
              ready=result.get('build_type')=='workflow'
          except urllib.error.HTTPError as error:
              if error.code!=404:raise
              ready=False
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('ready='+str(ready).lower()+'\n')
          if not ready:
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:output.write('Website built and checked. Activate **Settings → Pages → Source: GitHub Actions** in [Daf-Yomi](https://github.com/Moriahise/Daf-Yomi/settings/pages), then run this workflow again.\n')
          PY
      - name: Package the reader website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
          name: website-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish the reader website
        if: steps.pages.outputs.ready == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: website-${{ github.run_id }}-${{ github.run_attempt }}
